        :root{
            --bg:#FAF3E0;
            --white:#FFFFFF;
            --ink:#2A0E0E;
            --text:#6B5A4E;
            --border:#E6D9BE;

            --maroon:#3D0000;
            --maroon-2:#6B0000;
            --maroon-3:#1F0000;

            --gold:#D4AF37;
            --gold-light:#F5DEB3;
            --gold-dark:#8B6914;
            --gold-tint:#FBF0D9;

            --shadow-lg:0 15px 35px rgba(31,0,0,0.12);
            --shadow-gold:0 6px 20px rgba(212,175,55,.35);
        }

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }

        body{

            font-family:'DM Sans', 'Segoe UI', sans-serif;

            background:var(--bg);

            color:var(--ink);

            display:flex;

            justify-content:center;

            align-items:center;

            min-height:100vh;
        }

        h2{
            font-family:'Big Shoulders Display', sans-serif;
            color:var(--maroon-2);
        }

        .auth-card{

            background:var(--white);

            padding:30px;

            border-radius:18px;

            box-shadow:var(--shadow-lg);

            border:1px solid var(--border);

            width:100%;

            max-width:420px;
        }

        .tabs{

            display:flex;

            margin-bottom:25px;

            border-bottom:2px solid var(--border);
        }

        .tab-btn{

            flex:1;

            padding:12px;

            cursor:pointer;

            text-align:center;

            font-weight:bold;

            color:#9A8B7A;

            transition:0.3s;
        }

        .tab-btn.active{

            color:var(--maroon-2);

            border-bottom:3px solid var(--gold-dark);
        }

        .form-section{
            display:none;
        }

        .form-section.active{
            display:block;
        }

        .form-group{

            margin-bottom:15px;

            position:relative;
        }

        label{

            display:block;

            font-size:13px;

            margin-bottom:5px;

            font-weight:600;

            color:var(--ink);
        }

        input{

            width:100%;

            padding:12px;

            border:1px solid var(--border);

            border-radius:8px;

            outline:none;

            font-family:'DM Sans', sans-serif;

            color:var(--ink);
        }

        input:focus{

            border-color:var(--gold-dark);

            box-shadow:0 0 0 4px var(--gold-tint);
        }

        .eye-icon{

            position:absolute;

            right:15px;

            top:38px;

            cursor:pointer;

            color:#B0A18E;
        }

        .submit-btn{

            width:100%;

            padding:14px;

            background:linear-gradient(135deg, var(--gold-dark), var(--gold) 50%, var(--gold-light));

            color:var(--maroon-3);

            border:none;

            border-radius:8px;

            cursor:pointer;

            font-weight:bold;

            margin-top:10px;

            transition:0.3s ease;
        }

        .submit-btn:hover{

            background:linear-gradient(135deg, var(--gold-light), var(--gold), var(--gold-dark));

            box-shadow:var(--shadow-gold);

            transform:translateY(-2px);
        }

        .social-container{

            margin-top:20px;

            text-align:center;
        }

        .divider{

            margin:20px 0;

            font-size:12px;

            color:#A0937E;

            position:relative;
        }

        .divider::before,
        .divider::after{

            content:"";

            position:absolute;

            top:50%;

            width:30%;

            height:1px;

            background:var(--border);
        }

        .divider::before{
            left:0;
        }

        .divider::after{
            right:0;
        }

        .apple-btn{

            width:100%;

            padding:12px;

            border-radius:8px;

            background:var(--maroon-3);

            color:var(--gold-light);

            border:none;

            display:flex;

            font-weight:500;

            margin-top:10px;

            transition:0.3s ease;

    <script>

        // =========================
// TAB SWITCH
// =========================

function switchTab(tab){

    document
        .querySelectorAll(".tab-btn")
        .forEach(btn => {

            btn.classList.remove("active");
        });

    document
        .querySelectorAll(".form-section")
        .forEach(section => {

            section.classList.remove("active");
        });

    if(tab === "login"){

        document
            .querySelectorAll(".tab-btn")[0]
            .classList.add("active");

        document
            .getElementById("login-section")
            .classList.add("active");

    }else{

        document
            .querySelectorAll(".tab-btn")[1]
            .classList.add("active");

        document
            .getElementById("register-section")
            .classList.add("active");
    }
}



// =========================
// PASSWORD TOGGLE
// =========================

function toggle(id){

    const input =
        document.getElementById(id);

    input.type =
        input.type === "password"
        ? "text"
        : "password";
}

               sessionStorage.setItem("registerEmail", email);

// =========================
// LOGIN
// =========================

document
.getElementById("login-btn")
.addEventListener("click", async () => {

    const email =
        document.getElementById("login-email").value;

    const password =
        document.getElementById("l-pwd").value;

    try{

        const response = await fetch(
            "/login",

            {

                method:"POST",

                headers:{
                    "Content-Type":"application/json"
                },

                body:JSON.stringify({

                    email,
                    password
                })
            }
        );

        const data = await response.json();

        alert(data.message);

        if(data.success){

            // SAVE TOKEN

            localStorage.setItem(
                "token",
                data.token
            );

            // SAVE USER

            localStorage.setItem(
                "user",
                JSON.stringify(data.user)
            );

        if(data.user.role === "admin"){

    window.location.href = "admin.html";

}else{

    const redirect =
            localStorage.getItem("redirectAfterLogin") || "index.html";

        localStorage.removeItem("redirectAfterLogin");

        window.location.href = redirect;

}
        }

    }catch(error){

        console.log(error);

        alert("Server Error");
    }

});



// =========================
// GOOGLE LOGIN
// =========================

async function handleCredentialResponse(response){

    try{

        const res = await fetch(

            "/google-login",

            {

                method:"POST",

                headers:{
                    "Content-Type":"application/json"
                },

                body:JSON.stringify({

                    token:response.credential
                })
            }
        );

        const data = await res.json();

        if(data.success){

            // SAVE TOKEN

            localStorage.setItem(
                "token",
                data.token
            );

            alert("Google Login Success");

           if (data.role === "admin") {
         window.location.href = "admin.html";
         } else {
         window.location.href = "product.html";
          }
        }

    }catch(error){

        console.log(error);

        alert("Google Login Failed");
    }
}

// =========================
// VERIFY REGISTER OTP
// =========================

document
.getElementById("verify-register-otp-btn")
.addEventListener("click",async()=>{

    const otp =

    document.getElementById("register-otp").value;

    if(otp.length!==6){

        alert("Enter Valid OTP");

        return;

    }

    const email =

    sessionStorage.getItem("registerEmail");

    try{

        const response = await fetch(

            "/api/verify-register-otp",

            {

                method:"POST",

                headers:{

                    "Content-Type":"application/json"

                },

                body:JSON.stringify({

                    email,

                    otp

                })

            }

        );

        const data = await response.json();

        alert(data.message);

        if(data.success){

            localStorage.setItem(

                "token",

                data.token

            );

            sessionStorage.removeItem(

                "registerEmail"

            );

            window.location.href="product.html";

        }

    }catch(error){

        console.log(error);

        alert("Server Error");

    }

});





// ================= RESET PASSWORD =================

document
.getElementById("reset-password-btn")
.addEventListener("click",async()=>{

    const password =

    document.getElementById("new-password").value;

    const confirm =

    document.getElementById("confirm-new-password").value;

    if(password!==confirm){

        alert("Passwords do not match");

        return;

    }

    const email =

    sessionStorage.getItem("forgotEmail");

    try{

        const response = await fetch(

            "/api/reset-password",

            {

                method:"POST",

                headers:{

                    "Content-Type":"application/json"

                },

                body:JSON.stringify({

                    email,

                    password

                })

            }

        );

        const data = await response.json();

        alert(data.message);

        if(data.success){

            sessionStorage.removeItem("forgotEmail");

            switchTab("login");

        }

    }catch(error){

        console.log(error);

        alert("Server Error");

    }

});
