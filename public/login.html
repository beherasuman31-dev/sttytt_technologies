<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Auth | Velocity Electric</title>

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

    <style>

        :root{
            --primary-blue:#004aad;
        }

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }

        body{

            font-family:'Segoe UI',sans-serif;

            background:#e9ecef;

            display:flex;

            justify-content:center;

            align-items:center;

            min-height:100vh;
        }

        .auth-card{

            background:white;

            padding:30px;

            border-radius:18px;

            box-shadow:0 15px 35px rgba(0,0,0,0.1);

            width:100%;

            max-width:420px;
        }

        .tabs{

            display:flex;

            margin-bottom:25px;

            border-bottom:2px solid #eee;
        }

        .tab-btn{

            flex:1;

            padding:12px;

            cursor:pointer;

            text-align:center;

            font-weight:bold;

            color:#888;

            transition:0.3s;
        }

        .tab-btn.active{

            color:var(--primary-blue);

            border-bottom:3px solid var(--primary-blue);
        }

        .form-section{
            display:none;
        }

        .form-section.active{
            display:block;
        }

        .form-group{

            margin-bottom:15px;

            position:relative;
        }

        label{

            display:block;

            font-size:13px;

            margin-bottom:5px;

            font-weight:600;
        }

        input{

            width:100%;

            padding:12px;

            border:1px solid #ddd;

            border-radius:8px;

            outline:none;
        }

        input:focus{

            border-color:var(--primary-blue);
        }

        .eye-icon{

            position:absolute;

            right:15px;

            top:38px;

            cursor:pointer;

            color:#999;
        }

        .submit-btn{

            width:100%;

            padding:14px;

            background:var(--primary-blue);

            color:white;

            border:none;

            border-radius:8px;

            cursor:pointer;

            font-weight:bold;

            margin-top:10px;
        }

        .social-container{

            margin-top:20px;

            text-align:center;
        }

        .divider{

            margin:20px 0;

            font-size:12px;

            color:#aaa;

            position:relative;
        }

        .divider::before,
        .divider::after{

            content:"";

            position:absolute;

            top:50%;

            width:30%;

            height:1px;

            background:#eee;
        }

        .divider::before{
            left:0;
        }

        .divider::after{
            right:0;
        }

        .apple-btn{

            width:100%;

            padding:12px;

            border-radius:8px;

            background:black;

            color:white;

            border:none;

            cursor:pointer;

            display:flex;

            align-items:center;

            justify-content:center;

            font-weight:500;

            margin-top:10px;
        }

    </style>

</head>

<body>

    <script>

        // =========================
// TAB SWITCH
// =========================

function switchTab(tab){

    document
        .querySelectorAll(".tab-btn")
        .forEach(btn => {

            btn.classList.remove("active");
        });

    document
        .querySelectorAll(".form-section")
        .forEach(section => {

            section.classList.remove("active");
        });

    if(tab === "login"){

        document
            .querySelectorAll(".tab-btn")[0]
            .classList.add("active");

        document
            .getElementById("login-section")
            .classList.add("active");

    }else{

        document
            .querySelectorAll(".tab-btn")[1]
            .classList.add("active");

        document
            .getElementById("register-section")
            .classList.add("active");
    }
}



// =========================
// PASSWORD TOGGLE
// =========================

function toggle(id){

    const input =
        document.getElementById(id);

    input.type =
        input.type === "password"
        ? "text"
        : "password";
}

// =========================
// LOGIN
// =========================

document
.getElementById("login-btn")
.addEventListener("click", async () => {

    const email =
        document.getElementById("login-email").value;

    const password =
        document.getElementById("l-pwd").value;

    try{

        const response = await fetch(
            "http://localhost:5000/login",

            {

                method:"POST",

                headers:{
                    "Content-Type":"application/json"
                },

                body:JSON.stringify({

                    email,
                    password
                })
            }
        );

        const data = await response.json();

        alert(data.message);

        if(data.success){

            // SAVE TOKEN

            localStorage.setItem(
                "token",
                data.token
            );

            // SAVE USER

            localStorage.setItem(
                "user",
                JSON.stringify(data.user)
            );

        if(data.user.role === "admin"){

    window.location.href = "admin.html";

}else{

    window.location.href = "index.html";

}
        }

    }catch(error){

        console.log(error);

        alert("Server Error");
    }

});



// =========================
// GOOGLE LOGIN
// =========================

async function handleCredentialResponse(response){

    try{

        const res = await fetch(

            "http://localhost:5000/google-login",

            {

                method:"POST",

                headers:{
                    "Content-Type":"application/json"
                },

                body:JSON.stringify({

                    token:response.credential
                })
            }
        );

        const data = await res.json();

        if(data.success){

            // SAVE TOKEN

            localStorage.setItem(
                "token",
                data.token
            );

            alert("Google Login Success");

            window.location.href =
                "product.html";
        }

    }catch(error){

        console.log(error);

        alert("Google Login Failed");
    }
}

// =========================
// VERIFY REGISTER OTP
// =========================

document
.getElementById("verify-register-otp-btn")
.addEventListener("click",async()=>{

    const otp =

    document.getElementById("register-otp").value;

    if(otp.length!==6){

        alert("Enter Valid OTP");

        return;

    }

    const email =

    sessionStorage.getItem("registerEmail");

    try{

        const response = await fetch(

            "http://localhost:5000/api/verify-register-otp",

            {

                method:"POST",

                headers:{

                    "Content-Type":"application/json"

                },

                body:JSON.stringify({

                    email,

                    otp

                })

            }

        );

        const data = await response.json();

        alert(data.message);

        if(data.success){

            localStorage.setItem(

                "token",

                data.token

            );

            sessionStorage.removeItem(

                "registerEmail"

            );

            window.location.href="product.html";

        }

    }catch(error){

        console.log(error);

        alert("Server Error");

    }

});





// ================= RESET PASSWORD =================

document
.getElementById("reset-password-btn")
.addEventListener("click",async()=>{

    const password =

    document.getElementById("new-password").value;

    const confirm =

    document.getElementById("confirm-new-password").value;

    if(password!==confirm){

        alert("Passwords do not match");

        return;

    }

    const email =

    sessionStorage.getItem("forgotEmail");

    try{

        const response = await fetch(

            "http://localhost:5000/api/reset-password",

            {

                method:"POST",

                headers:{

                    "Content-Type":"application/json"

                },

                body:JSON.stringify({

                    email,

                    password

                })

            }

        );

        const data = await response.json();

        alert(data.message);

        if(data.success){

            sessionStorage.removeItem("forgotEmail");

            switchTab("login");

        }

    }catch(error){

        console.log(error);

        alert("Server Error");

    }

});
