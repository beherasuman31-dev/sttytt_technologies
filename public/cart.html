<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
    content="width=device-width, initial-scale=1.0">

    <title>
        STTYTT | Cart
    </title>

    <link rel="stylesheet"
    href="cart.css">

    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css'
    rel='stylesheet'>

</head>

<body>

      <!-- ================= NAVBAR ================= -->
   <header>
    <nav class="navbar">

        <a href="#" class="logo">
            <img src="image/1000561758-removebg-preview.png" alt="STTYTT Logo">
        </a>

        <ul class="nav-links">

            <li>
                <a href="index.html">Home</a>
            </li>

            <li>
                <a href="">Models</a>
            </li>

            <li>
                <a href="orders.html">Orders</a>
            </li>

        </ul>

        <div class="nav-icons">

            <!-- Mobile Menu -->
            <i class='bx bx-menu' id="menu-icon"></i>

        </div>

    </nav>

    </header>


    <!-- ================= CART ================= -->

    <section class="cart-section">

        <div class="cart-left">

            <h1>
                Shopping Cart
            </h1>

            <div id="cartContainer">

            </div>

        </div>


        <!-- ================= SUMMARY ================= -->

        <div class="cart-summary">

            <h2>
                Order Summary
            </h2>

            <div class="summary-row">

                <span>
                    Subtotal
                </span>

                <span id="subtotal">
                    ₹0
                </span>

            </div>

            <div class="summary-row">

                <span>
                    Shipping
                </span>
                <span id="shippingCharge">
                Calculate at Checkout
                </span>

            </div>

            <div class="summary-row total-row">

                <span>
                    Total
                </span>

                <span id="totalPrice">
                    ₹0
                </span>


            </div>
            <button  class="checkout-btn">

                Buy Now

            </button>

        </div>

    </section>

<script src="cart.js"></script>

</body>

</html>
