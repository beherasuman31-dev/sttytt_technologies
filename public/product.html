<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>STTYTT Bikes | Products</title>

    <link rel="stylesheet" href="product.css" />

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
</head>

<body>

    <!-- ================= NAVBAR ================= -->

    <nav class="navbar">

         <a href="#" class="logo">
            <img src="image/1000521806-removebg-preview.png" alt="STTYTT Logo">
        </a>

        <div class="nav-links">
            <a href="index.html">Home</a>
            <a href="">Models</a>
            <a href="orders.html">Orders</a>
        </div>

    </nav>


    <!-- ================= HERO ================= -->

    <section class="hero">

        <h1>
            Explore Our Electric Bycycles
        </h1>

        <p>
            High performance electric mobility for modern riders.
        </p>

    </section>


    <!-- ================= FILTER SECTION ================= -->

    <section class="filters-section">

        <div class="search-box">
            <input type="text" id="searchInput" placeholder="Search bike...">
        </div>

        <div class="filter-group">

            <select id="categoryFilter">
                <option value="">All Categories</option>
                <option value="Sport">Sport</option>
                <option value="Urban">Urban</option>
                <option value="Offroad">Offroad</option>
            </select>

            <select id="priceFilter">
                <option value="">Price Range</option>
                <option value="50000">Below ₹10,000</option>
                <option value="100000">Below ₹20,000</option>
                <option value="150000">Below ₹30,000</option>
            </select>

            <select id="sortFilter">
                <option value="">Sort By</option>
                <option value="low">Price Low to High</option>
                <option value="high">Price High to Low</option>
            </select>

        </div>

    </section>


    <!-- ================= PRODUCTS ================= -->

    <section class="products-section">

        <div class="products-grid" id="productsContainer">

            <!-- PRODUCTS LOAD HERE -->

        </div>

    </section>


    <!-- ================= PRODUCT MODAL ================= -->

    <div class="product-modal" id="productModal">

        <div class="modal-content">

            <span class="close-btn" id="closeModal">
                ✕
            </span>

            <div id="modalData"></div>

        </div>

    </div>


    <script src="product.js"></script>

</body>

</html>
