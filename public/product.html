<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>STTYTT Bikes | Products</title>
    <meta property="og:title" content="STTYTT Technologies">
<meta property="og:description" content="Electric Mobility Platform">
<meta property="og:image" content="https://www.sttytt.com/image/logo.png">
<meta property="og:url" content="https://www.sttytt.com/">
<meta property="og:type" content="website">
    <meta name="description" content="Buy premium electric bikes and scooters from STTYTT Technologies. Explore EV products, dealership opportunities, and sustainable mobility solutions across India.">
    <script type="application/ld+json">
{
  "@context":"https://schema.org",
  "@type":"Organization",
  "name":"STTYTT Technologies Pvt. Ltd.",
  "url":"https://www.sttytt.com",
  "logo":"https://www.sttytt.com/image/1000561758-removebg-preview.png"
}

      <link rel="canonical" href="https://www.sttytt.com/product.html">
    <link rel="stylesheet" href="product.css" />

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">

    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
</head>

<body>

    <!-- ================= NAVBAR ================= -->
   <header>
    <nav class="navbar">

        <a href="#" class="logo">
            <img src="image/1000561758-removebg-preview.png" alt="STTYTT Logo">
        </a>

        <ul class="nav-links">

            <li>
                <a href="index.html">Home</a>
            </li>

            <li>
                <a href="">Models</a>
            </li>

            <li>
                <a href="orders.html">Orders</a>
            </li>

        </ul>

        <div class="nav-icons">

            <!-- Mobile Menu -->
            <i class='bx bx-menu' id="menu-icon"></i>

        </div>

    </nav>

    </header>


    <!-- ================= HERO ================= -->

    <section class="hero">

        <h1>
            Explore Our Electric Bicycles
        </h1>

        <p>
            High performance electric mobility for modern riders.
        </p>

    </section>


    <!-- ================= FILTER SECTION ================= -->

    <section class="filters-section">

        <div class="search-box">
            <input type="text" id="searchInput" placeholder="Search bike...">
        </div>

        <div class="filter-group">

            <select id="categoryFilter">
                <option value="">All Categories</option>
                <option value="Sport">Sport</option>
                <option value="Urban">Urban</option>
                <option value="Offroad">Offroad</option>
            </select>

            <select id="priceFilter">
                <option value="">Price Range</option>
                <option value="50000">Below ₹10,000</option>
                <option value="100000">Below ₹20,000</option>
                <option value="150000">Below ₹30,000</option>
            </select>

            <select id="sortFilter">
                <option value="">Sort By</option>
                <option value="low">Price Low to High</option>
                <option value="high">Price High to Low</option>
            </select>

        </div>

    </section>


    <!-- ================= PRODUCTS ================= -->

    <section class="products-section">

        <div class="products-grid" id="productsContainer">

            <!-- PRODUCTS LOAD HERE -->

        </div>

    </section>


    <!-- ================= PRODUCT MODAL ================= -->

    <div class="product-modal" id="productModal">

        <div class="modal-content">

            <span class="close-btn" id="closeModal">
                ✕
            </span>

            <div id="modalData"></div>

        </div>

    </div>


    <script src="product.js"></script>

</body>


</html>
