<!-- =========================
CHECKOUT.HTML
========================= --><!DOCTYPE html><html lang="en">
<head><meta charset="UTF-8"><meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Checkout</title><link rel="stylesheet"
href="checkout.css"><link rel="stylesheet"href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

</head><body><div class="checkoutContainer"><!-- LEFT SIDE -->

<div class="leftSide">

    <!-- ADDRESS -->

    <div class="box">

        <div class="addressTop">

            <h2>Deliver To</h2>

            <button id="editBtn">
            Edit Address
            </button>

        </div>

        <div id="addressBox">

            Loading...

        </div>

    </div>


    <!-- CART ITEMS -->

    <div id="checkoutItems">

    </div>

</div>



<!-- RIGHT SIDE -->

<div class="rightSide">

    <!-- PRICE DETAILS -->

    <div class="box">

        <h2>Price Details</h2>

        <div class="priceRow">

            <span>Subtotal</span>

            <span id="subtotal">
            ₹0
            </span>

        </div>

        <div class="priceRow">

            <span>Shipping</span>

            <span>
            ₹0
            </span>

        </div>

        <hr>

        <div class="priceRow total">

            <span>Total</span>

            <span id="finalTotal">
            ₹0
            </span>

        </div>

    </div>


    <!-- PAYMENT -->

    <div class="box">

        <h2>Payment Method</h2>

        <div class="paymentOption">

            <input type="radio"
            name="payment"
            value="COD"
            checked>

            <span>
            Cash On Delivery
            </span>

        </div>


      <div class="paymentOption">

    <input
        type="radio"
        id="upi"
        name="payment"
        value="UPI"
    >

    <span>UPI Payment</span>

    
    <!-- ARROW -->

    <button id="upiToggle">


    </button>

</div>
   

    </div>


    <!-- BUTTON -->

    <button id="placeOrderBtn">

        PLACE ORDER

    </button>

</div>

</div><!-- ADDRESS MODAL --><div class="modal"
id="addressModal"><div class="modalContent">

    <h2>Edit Address</h2>

    <input type="text"
    id="name"
    placeholder="Full Name">

    <input type="text"
    id="phone"
    placeholder="Phone Number">

    <textarea
    id="address"
    placeholder="Address"></textarea>

    <input type="text"
    id="city"
    placeholder="City">

    <input type="text"
    id="state"
    placeholder="State">

    <input type="text"
    id="pincode"
    placeholder="Pincode">

    <button id="saveAddress">

    Save Address

    </button>

</div>

</div>
<script src="https://checkout.razorpay.com/v1/checkout.js"></script>
<script src="checkout.js"></script>
</body>
</html>
